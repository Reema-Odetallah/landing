<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="stylesheet" href="./assets/css/register.css"/>
</head>
<body>
   
      <form method="post" class="register">
        <div class="name"><h1>sign up</h1> </div>
        <div class="registerItem">
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname" class="input" >
        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lname" class="input">
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" class="input">
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd" class="input">
        <label for="pwd2">Confirm Password:</label>
        <input type="password" id="pwd2" name="pwd2" class="input">
        <input type="submit" value="register" class="input submit">
        <p>Already have an account? <a href="./login.html">Login</a></p>
    </div>
      </form> 
</body>
</html>
