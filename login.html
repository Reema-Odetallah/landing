<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="./assets/css/login.css"/>
</head>
<body>
    <form method="post" class="login">
      <div class="name"><h1>login</h1> </div>
      <div class="loginItem">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required class="input" >
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required class="input">
            <input type="submit" value="Submit" class="input submit">
            <p>Not registered? <a href="register.html">create an account</a></p>
        </div>
    </form>

</body>
</html>
